# Regenerate after changing queries or migrations: go tool sqlc generate
version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/event/queries.sql
    gen:
      go:
        package: eventdb
        out: internal/event/eventdb
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
