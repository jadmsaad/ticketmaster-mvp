# Regenerate after changing queries or migrations: go tool sqlc generate
version: "2"
overrides:
  go:
    overrides:
      - db_type: timestamptz
        go_type: time.Time
sql:
  - engine: postgresql
    schema: services/event/migrations
    queries: services/event/internal/postgres/queries.sql
    gen:
      go:
        package: eventdb
        out: services/event/internal/postgres/eventdb
        sql_package: pgx/v5
  - engine: postgresql
    schema: services/booking/migrations
    queries: services/booking/internal/postgres/queries.sql
    gen:
      go:
        package: bookingdb
        out: services/booking/internal/postgres/bookingdb
        sql_package: pgx/v5
